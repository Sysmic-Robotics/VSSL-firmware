; Para cargar ESTE sketch con PlatformIO sin tocar el firmware de produccion:
;   platformio run -d test/comm_test_base -t upload --upload-port COMx
[platformio]
src_dir = .

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<platformio.ini>
