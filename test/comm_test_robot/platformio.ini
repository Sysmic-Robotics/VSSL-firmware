; Para cargar ESTE sketch con PlatformIO sin tocar el firmware de produccion:
;   platformio run -d test/comm_test_robot -t upload --upload-port COMx
; Otro robot sin editar el .ino (PowerShell):
;   $env:PLATFORMIO_BUILD_FLAGS = "-DROBOT_ID=3"
[platformio]
src_dir = .

[env:robot]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<platformio.ini>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
