; BASE STATION OFICIAL (ESP32). Retransmite por ESP-NOW lo que llega por serie.
; Protocolo con el robot: magic 0xA5, version 1, V en mm/s y W en grados/s.
;
; Cargar (cambia COMx por el puerto de la base en tu PC):
;   platformio run -d base_station -t upload --upload-port COMx
;
; El puerto NO se fija aqui a proposito: cambia segun el PC y la placa.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
